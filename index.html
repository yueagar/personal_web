<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
        <meta
            name="description"
            content="Personal website of Yue Ka Leung Kelvin, a computer science student at CUHK."
        />

        <title>YueAgar_c's website</title>

        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/animations.css" />
        <link rel="stylesheet" href="css/mediaqueries.css" />

        <script src="js/loader.js"></script>
    </head>

    <body>
        <!-- Both navigation bars share the same links; only one is visible at a time. -->
        <nav id="desktop-nav">
            <div class="nav-logo">
                <a href="#profile" class="nav-link" data-section="profile" data-text="nav.logo">YueAgar_c</a>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="#about" class="nav-link" data-section="about" data-text="nav.about">About</a>
                </li>
                <li>
                    <a href="#experience" class="nav-link" data-section="experience" data-text="nav.experience"
                        >Experience</a
                    >
                </li>
                <li>
                    <a href="#coursework" class="nav-link" data-section="coursework" data-text="nav.coursework"
                        >Coursework</a
                    >
                </li>
                <li>
                    <a href="#projects" class="nav-link" data-section="projects" data-text="nav.projects">Projects</a>
                </li>
                <li>
                    <a href="#skills" class="nav-link" data-section="skills" data-text="nav.skills">Skills</a>
                </li>
                <li>
                    <a href="#contact" class="nav-link" data-section="contact" data-text="nav.contact">Contact</a>
                </li>
                <li><select class="language-select" aria-label="Language"></select></li>
            </ul>
        </nav>

        <nav id="hamburger-nav">
            <div class="nav-logo">
                <a href="#profile" class="nav-link" data-section="profile" data-text="nav.logo">YueAgar_c</a>
            </div>
            <div class="hamburger-menu">
                <div class="hamburger-icon" role="button" tabindex="0" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <ul class="menu-links">
                    <li>
                        <a href="#about" class="nav-link" data-section="about" data-text="nav.about">About</a>
                    </li>
                    <li>
                        <a href="#experience" class="nav-link" data-section="experience" data-text="nav.experience"
                            >Experience</a
                        >
                    </li>
                    <li>
                        <a href="#coursework" class="nav-link" data-section="coursework" data-text="nav.coursework"
                            >Coursework</a
                        >
                    </li>
                    <li>
                        <a href="#projects" class="nav-link" data-section="projects" data-text="nav.projects"
                            >Projects</a
                        >
                    </li>
                    <li>
                        <a href="#skills" class="nav-link" data-section="skills" data-text="nav.skills">Skills</a>
                    </li>
                    <li>
                        <a href="#contact" class="nav-link" data-section="contact" data-text="nav.contact">Contact</a>
                    </li>
                    <li>
                        <select class="language-select" aria-label="Language"></select>
                    </li>
                </ul>
            </div>
        </nav>

        <noscript>
            <p class="noscript-note">This site needs JavaScript to show its content.</p>
        </noscript>

        <section id="profile">
            <div class="profile-picture">
                <img class="avatar spin" data-render="profile-picture" alt="Profile picture" />
            </div>
            <div class="profile-texts">
                <p class="text-1" data-text="profile.greeting"></p>
                <p class="text-2" data-text="profile.name"></p>
                <p class="text-3" data-render="profile-study"></p>
                <div class="profile-buttons" data-render="profile-resume"></div>
                <div class="profile-socials" data-render="profile-socials"></div>
            </div>
        </section>

        <section id="about">
            <div class="section-heading">
                <p class="text-1" data-text="about.eyebrow"></p>
                <p class="text-2" data-text="about.heading"></p>
            </div>
            <div class="about-container">
                <div class="about-picture">
                    <img class="avatar" data-render="about-picture" alt="Me in Ueno Zoo" />
                </div>
                <div class="about-details">
                    <div class="about-cards">
                        <div class="card" data-render="about-education"></div>
                        <div class="card" data-render="about-achievements"></div>
                    </div>
                    <p class="text-5" data-text="about.intro"></p>
                </div>
            </div>
        </section>

        <section id="experience">
            <div class="section-heading">
                <p class="text-1" data-text="experience.eyebrow"></p>
                <p class="text-2" data-text="experience.heading"></p>
            </div>
            <div class="experience-container" data-render="experience"></div>
        </section>

        <section id="coursework">
            <div class="section-heading">
                <p class="text-1" data-text="coursework.eyebrow"></p>
                <p class="text-2" data-text="coursework.heading"></p>
            </div>
            <div class="coursework-container" data-render="coursework"></div>
        </section>

        <section id="projects">
            <div class="section-heading">
                <p class="text-1" data-text="projects.eyebrow"></p>
                <p class="text-2" data-text="projects.heading"></p>
            </div>
            <div class="projects-container" data-render="projects"></div>
        </section>

        <section id="skills">
            <div class="section-heading">
                <p class="text-1" data-text="skills.eyebrow"></p>
                <p class="text-2" data-text="skills.heading"></p>
            </div>
            <div class="skills-container" data-render="skills"></div>
        </section>

        <section id="contact">
            <div class="section-heading">
                <p class="text-1" data-text="contact.eyebrow"></p>
                <p class="text-2" data-text="contact.heading"></p>
            </div>
            <div class="contact-container" data-render="contact"></div>
        </section>

        <footer>
            <p class="text-4" data-render="footer"></p>
        </footer>
    </body>
</html>
